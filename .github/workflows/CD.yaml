name: CD-workflow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: checkout
      - name: Run a one-line script
        run: echo Hello, world!
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run a one-line script
        run: echo Hello, world!
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Run a one-line script
        run: echo Hello, world!        
