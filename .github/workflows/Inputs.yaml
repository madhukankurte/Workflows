name: input-workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [development, staging, production]
      version:
        type: string
      run_tests:
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: checkout
      - name: Run a script
        run: |
          chmod +x ascii-script.sh
          ./ascii-script.sh
