name: Expioring Secrects

on:
  workflow_dispatch:  

env:
    CONTATINER_REGISTRY: docker.io
    DOCKER_USERNAME: madhu93
    IMAGE_NAME: custom_nginx

jobs:

  docker:
    env:
      CONTATINER_REGISTRY: docker.io
      DOCKER_USERNAME: madhu93
      IMAGE_NAME: custom_nginx
    runs-on: ubuntu-latest
    steps:
      - name: Docker build
        run: echo docker build -t ${{ env.CONTATINER_REGISTRY }}/$DOCKER_USERNAME/$IMAGE_NAME:latest

      - name: Docker login
        env:
         DOCKER_PASSWORD: docker.io
        run: echo docker login --username=$DOCKER_USERNAME --password=$DOCKER_PASSWORD

      - name: Docker push
        run: echo docker push $CONTATINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest

  deploy:
    env:
      CONTATINER_REGISTRY: docker.io
      DOCKER_USERNAME: madhu93
      IMAGE_NAME: custom_nginx
    runs-on: ubuntu-latest
    needs: docker
    steps:
     - name: Docker build
       run: echo docker run -d -p 8080:8080 ${{ env.CONTATINER_REGISTRY }}/$DOCKER_USERNAME/$IMAGE_NAME:latest
                